# .github/workflows/module-renames-resync.yml
# Weekly re-sync of the cross-version module rename data (issue #380 item 2, ADR-0055).
#
# src/indexer/spec_data/module_renames.json is generated from the apriori.py of every
# N.0 branch of OCA/OpenUpgrade (renamed_modules / merged_modules), with the repo,
# branch, commit and path of each block recorded. This job keeps it current:
#   1. scripts/sync_module_renames.py --check  (git ls-remote + the raw apriori.py at
#      each branch head; exit 0 in sync / 1 drift / 2 source unreadable),
#   2. on drift: --write, push ONE bot branch and open - or refresh - ONE pull request.
# Nothing is cloned. A branch whose maps did not change keeps its recorded commit, so an
# unrelated upstream commit opens no PR. Never auto-merged: the read side validates every
# edge against the index, but the diff is still reviewed by a human.
#
# Sibling of cli-flags-resync.yml (same shape: SHA-pinned actions, write token only on
# the PR step, gh over REST, issue fallback when Actions may not open PRs).
# Manual trigger: gh workflow run module-renames-resync.yml

name: Module renames re-sync

permissions:
  contents: read

on:
  schedule:
    - cron: "41 3 * * 1"   # Mondays 03:41 UTC, after the CLI flags job
  workflow_dispatch: {}

concurrency:
  group: module-renames-resync
  cancel-in-progress: false

jobs:
  resync:
    # Forks cannot open PRs against the upstream data and would only burn minutes.
    # A manual run from another branch would build the bot branch from that ref and
    # carry its unrelated commits into the PR against the default branch: refuse it.
    if: >-
      github.repository == 'Viindoo/odoo-semantic-server' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      SYNC_BRANCH: automation/module-renames-resync
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Always the default branch, whatever ref dispatched the run.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.8"
          enable-cache: true
      - run: uv sync --locked

      - name: Check the rename data against OpenUpgrade
        id: check
        run: |
          set +e
          echo "REPORT=${RUNNER_TEMP}/module-renames-report.md" >> "$GITHUB_ENV"
          uv run python scripts/sync_module_renames.py --check \
            --report-file "${RUNNER_TEMP}/module-renames-report.md"
          code=$?
          set -e
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          cat "${RUNNER_TEMP}/module-renames-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh the re-sync pull request
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python scripts/sync_module_renames.py --write --report-file "$REPORT"
          if [ -z "$(git status --porcelain -- src/indexer/spec_data)" ]; then
            echo "check reported drift but --write changed nothing; stopping"
            exit 1
          fi
          {
            echo
            echo "Generated by the weekly workflow \`Module renames re-sync\` ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo "Not auto-merged: review the diff, merge. PRs opened by GITHUB_TOKEN do not trigger CI - close and reopen once to run it."
          } >> "$REPORT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -C "$SYNC_BRANCH"
          git add src/indexer/spec_data/module_renames.json
          git commit --quiet \
            -m "chore(spec-data): re-sync cross-version module renames from OpenUpgrade" \
            -m "Regenerated by scripts/sync_module_renames.py --write; each branch block records repo, branch, commit and path (ADR-0055)."
          git push --force origin "$SYNC_BRANCH"

          title="chore(spec-data): re-sync cross-version module renames from OpenUpgrade"
          open_pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${SYNC_BRANCH}" --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${open_pr}" \
              -f title="$title" -F body=@"$REPORT" --silent
            echo "refreshed PR #${open_pr}"
          elif gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f title="$title" -f head="$SYNC_BRANCH" -f base="$BASE_BRANCH" \
              -F body=@"$REPORT" --silent; then
            echo "opened a new PR from ${SYNC_BRANCH}"
          else
            echo "::warning::could not open a PR; filing an issue instead"
            issue_title="Cross-version module rename data drifted from OpenUpgrade"
            {
              cat "$REPORT"
              echo
              echo "The fix is on branch \`${SYNC_BRANCH}\`: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/${BASE_BRANCH}...${SYNC_BRANCH}"
            } > "$RUNNER_TEMP/issue-body.md"
            open_issue=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
              --jq "[.[] | select(.pull_request | not) | select(.title == \"${issue_title}\")][0].number // empty")
            if [ -n "$open_issue" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${open_issue}" \
                -F body=@"$RUNNER_TEMP/issue-body.md" --silent
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" \
                -f title="$issue_title" -F body=@"$RUNNER_TEMP/issue-body.md" --silent
            fi
          fi
